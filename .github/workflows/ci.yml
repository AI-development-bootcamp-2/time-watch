name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: timewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci || npm install
      - name: Run tests with coverage
        working-directory: backend
        run: npm test -- --coverage --forceExit --passWithNoTests --coverageThreshold='{"global":{"branches":35, "functions":40, "lines":70, "statements":70}}' || true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/timewatch_test
          JWT_SECRET: ci-test-secret
          NODE_ENV: test

  branch-check:
    name: Branch Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Only dev can merge into main
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "PRs to main are only allowed from the dev branch."
            exit 1
          fi

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi
      - name: Run tests
        working-directory: frontend
        run: npm run test -- --passWithNoTests || true

