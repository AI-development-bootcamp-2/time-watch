services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timewatch}
      POSTGRES_USER: ${POSTGRES_USER:-timewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timewatch}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "npx knex --knexfile knexfile.cjs migrate:latest && node src/index.js"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-timewatch}:${POSTGRES_PASSWORD:-timewatch}@db:5432/${POSTGRES_DB:-timewatch}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      BACKEND_URL: http://backend:3000
      VITE_API_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
