## Project schema\r
\r
```\r
users        id, full_name, email, password_hash, role (רגיל|אדמין), deleted_at\r
clients      id, name, deleted_at\r
projects     id, client_id, name, deleted_at\r
tasks        id, project_id, name, status, deleted_at\r
user_tasks   user_id, task_id  ← assignment table (users assigned to tasks, not projects)\r
