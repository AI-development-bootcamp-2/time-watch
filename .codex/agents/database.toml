```\r
\r
Key rules:\r
- `deleted_at IS NULL` filter on every SELECT — soft deletes everywhere\r
- Use `TIMESTAMPTZ` for all timestamps\r
- `RETURNING id, ...` after INSERT/UPDATE to avoid a second query\r
